[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-backend"
version = "0.1.0"
description = "Project ARGUS attendance backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Vision stack: SCRFD detection, ArcFace embedding and dense landmarks all run on
# onnxruntime against the InsightFace buffalo_l ONNX pack, so no framework
# (torch / insightface) is pulled in at serving time.
recognition = [
    "chromadb>=0.5",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.18",
]
# Cloudflare R2 is S3-compatible.
storage = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "database: requires a live PostgreSQL instance (ARGUS_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
